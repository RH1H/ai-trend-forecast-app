<!DOCTYPE html>
<html>
<head>
    <title>AI Impact Prediction</title>
</head>
<body>
    <h1><b>AI Impact Prediction Form</b></h1>
    <form method="POST">
        {% for feature in features %}
            <label>{{ feature }}:</label>
            <input type="text" name="{{ feature }}"><br><br>
        {% endfor %}
        <input type="submit" value="Predict">
    </form>

    {% if prediction is defined %}
        <h2>Prediction Result:</h2>
        <p><b>Predicted Value:</b> {{ prediction }}</p>

        <h3>Input Summary:</h3>
        <ul>
        {% for feature, value in input_data.items() %}
            <li><b>{{ feature }}</b>: {{ value }}</li>
        {% endfor %}
        </ul>
    {% endif %}
</body>
</html>
